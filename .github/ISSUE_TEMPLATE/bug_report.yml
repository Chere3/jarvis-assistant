name: Bug report
description: Something is not working as it should
labels: ["bug"]
body:
  - type: textarea
    id: que-paso
    attributes:
      label: What happened
      description: Describe the observed behavior and the expected one.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: entorno
    attributes:
      label: Environment
      description: Output of `jarvis doctor`, macOS version and chip.
    validations:
      required: true
