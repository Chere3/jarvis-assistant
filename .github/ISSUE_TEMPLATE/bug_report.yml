name: Reporte de error
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: textarea
    id: que-paso
    attributes:
      label: Qué pasó
      description: Describe el comportamiento observado y el esperado.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: entorno
    attributes:
      label: Entorno
      description: Salida de `jarvis doctor`, versión de macOS y chip.
    validations:
      required: true
