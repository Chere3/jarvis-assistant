[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "Asistente personal de escritorio con voz, memoria wiki y Claude"
requires-python = ">=3.12,<3.13"
dependencies = [
  "claude-agent-sdk>=0.2.152,<0.3",
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "sounddevice>=0.5",
  "numpy>=1.26",
  "faster-whisper>=1.2",
  "openwakeword>=0.6",
  "webrtcvad-wheels>=2.0",
  "pvporcupine>=4.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pypdf>=5.0",
  "kokoro-onnx>=0.6",
  "mlx-whisper>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
# Este proyecto se ejecuta solo en macOS Apple Silicon; evita resolver ruedas Linux (tflite-runtime).
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
